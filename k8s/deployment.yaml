apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-saas-backend
  namespace: library-saas
  labels:
    app.kubernetes.io/name: library-saas
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: library-saas
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: library-saas
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: app
          # The Kubernetes node runs its own containerd image store, separate from
          # the Docker daemon, so a locally built image is NOT visible to it
          # (that produces ErrImageNeverPull). Images are published to a local
          # registry container instead; 192.168.65.254 is the host as seen from a
          # Docker Desktop pod. The tag is replaced per build by `kubectl set image`.
          image: 192.168.65.254:5000/library-saas-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: library-saas-config
            - secretRef:
                name: library-saas-secrets

          # The application needs roughly 35s to become healthy. startupProbe
          # absorbs that window so livenessProbe can stay aggressive afterwards
          # without ever killing a still-booting pod.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
