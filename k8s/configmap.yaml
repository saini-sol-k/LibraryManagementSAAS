# Non-sensitive runtime configuration only.
# Credentials live in the Secret, which is created from Jenkins credentials at
# deploy time and is never committed with real values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: library-saas-config
  namespace: library-saas
  labels:
    app.kubernetes.io/name: library-saas
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SERVER_PORT: "8080"

  # Library SaaS has its own dedicated MySQL container on the host
  # (library-saas-mysql, host port 3310), not inside the cluster, so it is not
  # duplicated as a Kubernetes workload. It is a separate instance with its own
  # volume and credentials, shared with no other project.
  # host.docker.internal resolves to the host from Docker Desktop pods.
  MYSQL_HOST: "host.docker.internal"
  MYSQL_PORT: "3310"
  MYSQL_DATABASE: "library_saas"

  # The dedicated database starts empty, so Flyway owns schema creation from
  # V1__initial_schema.sql. It is idempotent: on an already-migrated database it
  # reads flyway_schema_history and applies nothing.
  SPRING_FLYWAY_ENABLED: "true"
