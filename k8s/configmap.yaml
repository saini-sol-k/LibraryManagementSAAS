# Non-sensitive runtime configuration only.
# Credentials live in the Secret, which is created from Jenkins credentials at
# deploy time and is never committed with real values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: library-saas-config
  namespace: library-saas
  labels:
    app.kubernetes.io/name: library-saas
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SERVER_PORT: "8080"

  # MySQL runs as a Docker container on the host (aklibrary_mysql, port 3307),
  # not inside the cluster, so it is not duplicated as a Kubernetes workload.
  # host.docker.internal resolves to the host from Docker Desktop pods.
  MYSQL_HOST: "host.docker.internal"
  MYSQL_PORT: "3307"
  MYSQL_DATABASE: "library_saas"

  # Flyway stays off in the dev profile; the schema already exists.
  # Set to "true" for a first deploy against an empty database.
  SPRING_FLYWAY_ENABLED: "false"
