# TEMPLATE ONLY - contains no real values and is safe to commit.
#
# The real Secret is created at deploy time from Jenkins credentials, so no
# credential is ever written to this repository:
#
#   kubectl -n library-saas create secret generic library-saas-secrets \
#     --from-literal=JWT_SECRET='<value>' \
#     --from-literal=MYSQL_USER='<value>' \
#     --from-literal=MYSQL_PASSWORD='<value>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Generate a JWT secret with: openssl rand -base64 48
# It must be at least 32 bytes; the application refuses to start otherwise.
apiVersion: v1
kind: Secret
metadata:
  name: library-saas-secrets
  namespace: library-saas
  labels:
    app.kubernetes.io/name: library-saas
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_AT_LEAST_32_BYTES"
  MYSQL_USER: "REPLACE_ME"
  MYSQL_PASSWORD: "REPLACE_ME"
