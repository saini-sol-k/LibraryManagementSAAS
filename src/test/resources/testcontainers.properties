# Testcontainers configuration used only for tests in this project
# Point Testcontainers to the local TCP Docker daemon exposed by Docker Desktop
# when "Expose daemon on tcp://localhost:2375" is enabled.
# This file is on the test classpath so Testcontainers reads it early during
# initialization (before JUnit/Testcontainers extensions start containers).

# Use the TCP scheme; docker-java expects DOCKER_HOST like tcp://host:port
docker.host=tcp://localhost:2375
# Ensure docker-java uses an API version compatible with Docker Desktop 29.7.2
docker.api.version=1.55