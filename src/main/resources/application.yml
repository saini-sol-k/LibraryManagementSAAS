spring:
  application:
    name: library-saas-backend
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

# App specific
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# JWT configuration (use env vars in production)
jwt:
  secret: ${JWT_SECRET:change-me-dev-secret-do-not-use-in-prod}
  access-token-expiration-sec: ${JWT_ACCESS_TOKEN_EXP_SEC:3600}
