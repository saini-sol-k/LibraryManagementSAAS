spring:
  datasource:
    # Defaults are the dedicated Library SaaS database (library-saas-mysql, host
    # port 3310). They are deliberately NOT another project's: a bare
    # `mvn spring-boot:run` with no environment set must reach this project's own
    # database or none at all, never a neighbouring one that happens to be up.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3310}/${MYSQL_DATABASE:library_saas}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:library}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          batch_versioned_data: true
  
  flyway:
    enabled: false
    baselineOnMigrate: true
    locations: classpath:db/migration

# Development logging configuration
logging:
  level:
    root: WARN
    com.librarysaas: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
